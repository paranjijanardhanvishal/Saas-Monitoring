project-includes = [
    "backend",
    "agent",
    "tests",
    "scripts",
]
project-excludes = [
    "**/node_modules",
    "**/__pycache__",
    "**/.pytest_cache",
    "**/venv",
    "**/.verify-venv",
    "**/frontend",
]
site-packages-path = [
    "backend",
    "agent",
    "venv/Lib/site-packages",
    ".verify-venv/Lib/site-packages",
]
python-platform = "windows"
python-version = "3.12.0"
permissive-ignores = true
check-unannotated-defs = false
disable-type-errors-in-ide = false

[errors]
invalid-variance = "ignore"
bad-override-param-name = "ignore"
bad-override = "ignore"
