# Render Blueprint for the SaaS Security Monitor backend.
#
# Before deploying:
#   1. Set MONGODB_URI to a TLS-enabled MongoDB connection string.
#   2. Set FRONTEND_URL to the exact HTTPS origin of the console.
#   3. Keep COOKIE_SECURE=true and serve the API only over HTTPS.
#   4. Set COOKIE_SAMESITE=none only when the frontend is on a different site;
#      use lax when frontend and API share a site (for example a proxy setup).
#   5. If the SaaS proxy is used, copy the generated INGESTION_API_KEY to the
#      proxy host. Never expose it to a browser.
#
# JWT_SECRET_KEY and INGESTION_API_KEY are generated by Render and stored as
# secrets. Do not commit real values to this file.

services:
  - type: web
    name: saas-security-backend
    env: python
    rootDir: backend
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGO_DB_NAME
        value: saas_security
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 480
      - key: INGESTION_API_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: COOKIE_SECURE
        value: true
      - key: COOKIE_SAMESITE
        value: none
      - key: PII_ENGINE
        value: auto
      - key: PII_MAX_TEXT_LENGTH
        value: 100000
      - key: AUTO_RISK_ENABLED
        value: true
      - key: AGENT_HEARTBEAT_STALE_SECONDS
        value: 180
      - key: EVENT_RETENTION_DAYS
        value: 90
      - key: AUDIT_RETENTION_DAYS
        value: 365
      # Optional integrations. Leave unset to keep them disabled; the system
      # reports skipped_not_configured instead of pretending to deliver.
      # - key: SLACK_WEBHOOK_URL
      #   sync: false
      # - key: JIRA_API_URL
      #   sync: false
      # - key: JIRA_AUTH_TOKEN
      #   sync: false
      # - key: JIRA_PROJECT_KEY
      #   value: SEC
      # - key: JIRA_ISSUE_TYPE
      #   value: Incident
